[build]
  # Fully bundle drain-background.js (no externals) — BG isolate has no npm resolve.
  command = "bun run build:vessel && bun run build:drain-fn"
  publish = "apps/vessel/.next"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."drain-background"]
  # Pre-built single CJS file from build:drain-fn; do not re-bundle or externalise.
  node_bundler = "none"

# Background functions: *-background get a 15-minute limit.
