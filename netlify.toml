[build]
  # Fully bundle drain-background.mjs (no externals) — BG isolate has no npm resolve.
  command = "bun run build:vessel && bun run build:drain-fn"
  publish = "apps/vessel/.next"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."drain-background"]
  # Pre-built single ESM file from build:drain-fn. "none" is valid on Netlify
  # build (BG isolate has no npm resolve); the CLI schema omits it — ignore CLI lint.
  node_bundler = "none"

# Background functions: *-background get a 15-minute limit.
