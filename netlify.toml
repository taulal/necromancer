[build]
  # Fully bundle drain-background.mjs (no externals) — BG isolate has no npm resolve.
  command = "bun run build:vessel && bun run build:drain-fn"
  publish = "apps/vessel/.next"

[functions]
  directory = "netlify/functions"
  # drain-background.mjs is fully pre-bundled by build:drain-fn (no externals).
  # CLI rejects node_bundler=none in toml; esbuild on a self-contained .mjs is a no-op.
  node_bundler = "esbuild"

# Background functions: *-background get a 15-minute limit.
