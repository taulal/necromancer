[build]
  command = "bun run build:vessel"
  publish = "apps/vessel/.next"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # @necro/* are source-only TS workspace packages: esbuild must bundle them (B3).
  external_node_modules = ["@sanity/client", "@sanity/workflow-engine"]

# Background functions: *-background get a 15-minute limit.
