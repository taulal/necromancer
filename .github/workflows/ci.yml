name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build App
        run: bun run build:app

      # Catches Studio imports pulled into server routes (Turbopack + swr react-server).
      - name: Build Vessel
        run: bun run build:vessel

      - name: No Studio imports in Vessel/Functions packages
        run: |
          if rg -n "from ['\"]sanity['\"]|from ['\"]sanity/" packages/bones packages/hq-schema packages/exhume packages/autopsy packages/rituals functions --glob '*.{ts,tsx}'; then
            echo "::error::Packages used by Vessel/Functions must import from @sanity/types, @sanity/client, or @sanity/schema — not sanity"
            exit 1
          fi
          echo "ok: no sanity Studio imports in shared packages"
